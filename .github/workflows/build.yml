name: Build IPA

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch ChOma headers
        run: |
          git clone --depth=1 https://github.com/opa334/ChOma.git /tmp/ChOma
          cp /tmp/ChOma/src/*.h LocationSpoofer/headers/

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Archive (unsigned)
        run: |
          xcodebuild archive \
            -project LocationSpoofer.xcodeproj \
            -scheme LocationSpoofer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/LocationSpoofer.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            LIBRARY_SEARCH_PATHS="$GITHUB_WORKSPACE/LocationSpoofer/lib" \


      - name: Export unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa"
          APP_PATH=$(find "$RUNNER_TEMP/LocationSpoofer.xcarchive" -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive, listing archive contents:"
            find "$RUNNER_TEMP/LocationSpoofer.xcarchive" -type f | head -40
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r "$RUNNER_TEMP/LocationSpoofer.ipa" Payload
          echo "IPA created successfully"
          ls -lh "$RUNNER_TEMP/LocationSpoofer.ipa"

      - name: Publish IPA — Latest Build (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          files: ${{ runner.temp }}/LocationSpoofer.ipa
          body: |
            Rolling build from the latest commit on `main`.

            Unsigned IPA — sideload with Sideloadly, AltStore, or TrollStore.

      - name: Publish IPA — Versioned Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LocationSpoofer ${{ github.ref_name }}
          files: ${{ runner.temp }}/LocationSpoofer.ipa
          body: |
            ## LocationSpoofer ${{ github.ref_name }}

            Unsigned IPA — sideload with Sideloadly, AltStore, or TrollStore.

            No jailbreak required. Works on stock iOS.
          draft: false
          prerelease: false

