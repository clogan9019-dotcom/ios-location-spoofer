name: Build IPA

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build time
        run: echo "BUILD_TIME=$(TZ='America/New_York' date '+%B %d, %Y at %I:%M %p %Z')" >> $GITHUB_ENV

      - name: Fetch ChOma headers
        run: |
          git clone --depth=1 https://github.com/opa334/ChOma.git /tmp/ChOma
          cp /tmp/ChOma/src/*.h LocationSpoofer/headers/

      - name: Ensure Secrets.swift exists (git-ignored) for build
        run: |
          if [ ! -f LocationSpoofer/Secrets.swift ]; then
            cp LocationSpoofer/Secrets.swift.example LocationSpoofer/Secrets.swift
          fi

      - name: Select Xcode
        run: |
          # macos-14 images ship with multiple Xcodes; pick any 16.x that exists.
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install ldid & cctools (for install_name_tool)
        run: |
          brew install ldid ld64 cctools || true

      - name: Fix dylib install names (embed at @executable_path/Frameworks)
        run: |
          DYLIB_DIR="$GITHUB_WORKSPACE/LocationSpoofer/lib"
          for dylib in "$DYLIB_DIR"/*.dylib; do
            name=$(basename "$dylib")
            install_name_tool -id "@executable_path/Frameworks/$name" "$dylib" || true
          done
          otool -L "$DYLIB_DIR"/*.dylib || true

      - name: Build Archive (unsigned)
        run: |
          xcodebuild archive \
            -project LocationSpoofer.xcodeproj \
            -scheme LocationSpoofer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/LocationSpoofer.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            LIBRARY_SEARCH_PATHS="$GITHUB_WORKSPACE/LocationSpoofer/lib" \
            HEADER_SEARCH_PATHS="$GITHUB_WORKSPACE/LocationSpoofer/headers $GITHUB_WORKSPACE/LocationSpoofer/kexploit $GITHUB_WORKSPACE/LocationSpoofer/kexploit/pe $GITHUB_WORKSPACE/LocationSpoofer/kexploit/TaskRop" \
            CLANG_ENABLE_MODULES=YES


      - name: Export and sign IPA with ldid
        run: |
          mkdir -p "$RUNNER_TEMP/ipa"
          APP_PATH=$(find "$RUNNER_TEMP/LocationSpoofer.xcarchive" -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive, listing archive contents:"
            find "$RUNNER_TEMP/LocationSpoofer.xcarchive" -type f | head -40
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          # Make sure embedded dylibs have correct install-name/load-commands for @executable_path/Frameworks
          FRAMEWORKS_DIR="$RUNNER_TEMP/ipa/Payload/LocationSpoofer.app/Frameworks"
          if [ -d "$FRAMEWORKS_DIR" ]; then
            for dylib in "$FRAMEWORKS_DIR"/*.dylib; do
              name=$(basename "$dylib")
              install_name_tool -id "@executable_path/Frameworks/$name" "$dylib" || true
            done
          fi

          BINARY="$RUNNER_TEMP/ipa/Payload/LocationSpoofer.app/LocationSpoofer"
          echo "Signing binary with ldid: $BINARY"
          ldid -SLocationSpoofer/LocationSpoofer.entitlements "$BINARY"
          echo "ldid signing complete"

          cd "$RUNNER_TEMP/ipa"
          zip -r "$RUNNER_TEMP/LocationSpoofer.ipa" Payload
          echo "IPA created successfully"
          ls -lh "$RUNNER_TEMP/LocationSpoofer.ipa"

      - name: Publish IPA — Latest Build (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          files: ${{ runner.temp }}/LocationSpoofer.ipa
          body: |
            Rolling build from the latest commit on `main`.

            Built: ${{ env.BUILD_TIME }}

            Unsigned IPA — sideload with Sideloadly, AltStore, or TrollStore.

      - name: Publish IPA — Versioned Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LocationSpoofer ${{ github.ref_name }}
          files: ${{ runner.temp }}/LocationSpoofer.ipa
          body: |
            ## LocationSpoofer ${{ github.ref_name }}

            Unsigned IPA — sideload with Sideloadly, AltStore, or TrollStore.

            No jailbreak required. Works on stock iOS.
          draft: false
          prerelease: false
